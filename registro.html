<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
 <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
 <link rel="stylesheet" href="estilo.css">
</head>
<body class="bodyinicio">
    <div class="login-card">
        <form id="registroForm">
            <h2>REGISTRO</h2>
            <div class="mb-3">
                <label for="nombre" class="form-label">nombre</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
                <label for="paterno" class="form-label">apellido paterno</label>
                <input type="text" class="form-control" id="paterno" required>
            </div>
            <div class="mb-3">
                <label for="materno" class="form-label">apellido materno</label>
                <input type="text" class="form-control" id="materno" required>
            </div>
            <div class="mb-3">
                <label for="control" class="form-label">#de control</label>
                <input type="text" class="form-control" id="control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">contrasena</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <label for="confirmar" class="form-label">confirmar contrasena</label>
                <input type="password" class="form-control" id="confirmar" required>
            </div>
            <div class="mb-3">
                <label for="semestre" class="form-label">Semestre</label>
                <select class="form-control form-control-caret" id="semestre">
                    <option value="1">1 semestre</option>
                    <option value="2">2 semestre</option>
                    <option value="3">3 semestre</option>
                    <option value="4">4 semestre</option>
                    <option value="5">5 semestre</option>
                    <option value="6">6 semestre</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="carrera" class="form-label">Carrera</label>
                <select class="form-control form-control-caret" id="carrera">
                    <option value="1">programacion</option>
                    <option value="2">ventas</option>
                    <option value="3">alimentos y bebidas</option>
                </select>
            </div>
            <button type="submit" class="btn-solid theme-success bin-login">
                registrarme
            </button>
            <div class="registro">
                <a href="login.html">ya tienes cuenta? inicia secion</a>
            </div>
        </form>
    </div>
    <script src="registro.js"></script>
</body>
</html>
