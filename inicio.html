<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>INICIO LIBRERIA DEL CBTIS</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
 <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
 <link rel="stylesheet" href="estilo.css">
</head>
<!--esto es para la compra-->
<body class="inicio">
    <nav class="navbar bg-primary text-white px-4">
        <div style="text-align: center;">
        <p class="navbar-brand text-white" id="bienvenida">Bienvenido</p>
        <button class="btn-solid theme-danger btn-sm" id="btnSalir">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h3 id="tituloSemestre" class="mb-3">Libros disponibles</h3>
                <div class="row" id="contenedorLibros"></div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Carrito de compras</h4>
                    <ul class="list-group mb-3" id="listaCarrito"></ul>
                    <h5>Total: $<span id="totalCarrito">0</span></h5>
                    <button class="btn-solid theme-success w-100 mb-2" id="btnComprar">Finalizar compra</button>
                    <button class="btn-outline theme-danger w-100" id="btnVaciar">Borrar todo el carrito</button>
                </div>
            </div>
        </div>
    </div>

    <script src="inicio.js"></script>
</body>
</html>
