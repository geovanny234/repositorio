<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
 <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
 <link rel="stylesheet" href="estilo.css">
</head>
<body class="bodyinicio">
    <div class="login-card">
        <h2>BIENVENIDO</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="control" class="form-label">numero de control</label>
                <input type="text" class="form-control" id="control" name="control" placeholder="ingrese tu numero de control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-solid theme-primary bin-login">
                ingresar
            </button>
            <div class="registro">
                <p>No tiene una cuenta por noob</p>
                <a href="registro.html" class="btn-outline theme-success bin-login">
                    registrarse
                </a>
            </div>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
